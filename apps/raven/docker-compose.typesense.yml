services:
  typesense:
    image: typesense/typesense:0.25.2
    container_name: raven-typesense
    ports:
      - "8110:8108"
    environment:
      TYPESENSE_API_KEY: TypesenseBurntMyMoustache2025
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200 OK'",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  typesense_data:
