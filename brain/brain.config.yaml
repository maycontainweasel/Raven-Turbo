  decisionsMustBeExplicit: true
  openLoopsAreFirstClass: true
  repetitionIsSignal: true
  extensionProposalRequired: true
  deploymentPreservesExistingMemory: true
  brainAssistIgnoresRoutineNoise: true
  noSecretsInBrain: true
  privateFinancialSourceRequiresExplicitInstruction: true
