brain:
  version: 0.2.0
  project: raven
  mode: foundation

modules:
  core: enabled
  ingest: enabled
  brainAssist: enabled
  liveCapture: enabled
  backfill: enabled
  healthCheck: enabled
  orbitSync: enabled
  financialPrivacy: enabled
  productStrategy: enabled
  technicalArchitecture: enabled
  projectManagement: orbit

sync:
  markdown: canonical_narrative_memory
  orbit: canonical_planning_control
